name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "10.*"
          - php: "8.2"
            laravel: "11.*"
          - php: "8.2"
            laravel: "12.*"
          - php: "8.3"
            laravel: "13.*"
          - php: "8.4"
            laravel: "13.*"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          # 1. Turn off the security advisory block specifically for the test environment
          composer config policy.advisories.block false
          
          # 2. Dynamically require the matching version of Orchestra Testbench before updating
          if [ "${{ matrix.laravel }}" = "10.*" ]; then
            composer require "orchestra/testbench:^8.0" --dev --no-update --no-interaction
          elif [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer require "orchestra/testbench:^9.0" --dev --no-update --no-interaction
          elif [ "${{ matrix.laravel }}" = "12.*" ]; then
            composer require "orchestra/testbench:^10.0" --dev --no-update --no-interaction
          elif [ "${{ matrix.laravel }}" = "13.*" ]; then
            composer require "orchestra/testbench:^11.0" --dev --no-update --no-interaction
          fi
          
          # 3. Force the specific Laravel version from your test matrix
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          
          # 4. Run the actual update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

